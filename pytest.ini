[pytest]
# The trees whose dependencies `requirements.txt` installs. `genoar_rag/backend`
# declares its own in `genoar_rag/backend/pyproject.toml` and is run from there;
# collecting it from here only reports imports the root environment was never
# meant to satisfy.
testpaths =
    cycle_test
    genoar_analysis
    genoar_crawler

norecursedirs =
    docs/internal
    genoar_rag
    .git
    *.egg-info
