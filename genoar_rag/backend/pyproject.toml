[project]
name = "genoar-rag-backend"
version = "0.1.0"
description = "GENOAR RAG Backend - SQL-based structured search API for SRA samples"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "pymysql>=1.1.0",  # MySQL/MariaDB backend (DB_BACKEND=mysql); SQLite path needs no driver
    "h5py>=3.10.0",  # reads how a matrix was made, out of the matrix itself
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
